# SonarCloud project configuration.
# The authentication token is NEVER stored here. Export SONAR_TOKEN in your
# shell or CI secret store; the scanner reads it from the environment.

sonar.host.url=https://sonarcloud.io
sonar.organization=<your-sonarcloud-organization>
sonar.projectKey=<your-sonarcloud-project-key>
sonar.projectName=WealthWise Backend
sonar.projectVersion=0.0.1

sonar.sources=src
sonar.tests=test,src
sonar.test.inclusions=**/*.spec.ts,test/**/*.ts
sonar.exclusions=dist/**,node_modules/**,coverage/**,prisma/generated/**,logs/**
sonar.coverage.exclusions=**/*.spec.ts,test/**,prisma/generated/**,src/main.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
